plugins {
    id 'java'
    alias(libs.plugins.boot)
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':libs:platform-core')
    implementation platform(libs.boot.bom)
    implementation platform(libs.cloud.bom)
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    annotationProcessor libs.boot.processor
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation libs.archunit
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

springBoot {
    buildInfo {
        excludes = ['time']
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Stable artifact name for root multi-project Docker builds; version remains in build info.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

// Java 25에서 Mockito의 동적 self-attach에 의존하지 않는다. 테스트 JVM 시작 시 agent를 명시한다.
tasks.withType(Test).configureEach {
    doFirst {
        jvmArgs "-javaagent:${classpath.find { it.name.startsWith('mockito-core-') }}"
    }
}
