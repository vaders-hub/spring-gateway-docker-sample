server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  netty:
    connection-timeout: ${SERVER_NETTY_CONNECTION_TIMEOUT:2s}
    idle-timeout: ${SERVER_NETTY_IDLE_TIMEOUT:30s}
    max-keep-alive-requests: ${SERVER_NETTY_MAX_KEEP_ALIVE_REQUESTS:1000}

spring:
  application:
    name: gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  codec:
    max-in-memory-size: 1MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
  cloud:
    gateway:
      server:
        webflux:
          metrics:
            enabled: true
            path-tags:
              enabled: false
          httpclient:
            connect-timeout: ${BACKEND_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${BACKEND_RESPONSE_TIMEOUT:5s}
            pool:
              type: fixed
              max-connections: ${BACKEND_MAX_CONNECTIONS:50}
              acquire-timeout: ${BACKEND_ACQUIRE_TIMEOUT_MS:2000}
              max-idle-time: ${BACKEND_MAX_IDLE_TIME:30s}
              max-life-time: ${BACKEND_MAX_LIFE_TIME:5m}
              metrics: true
          routes:
            - id: backend-api
              uri: ${BACKEND_URL:http://localhost:8081}
              predicates:
                - Path=/api/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@principalKeyResolver}"
                    redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:2}
                    redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:5}
                    redis-rate-limiter.requestedTokens: 1
                - StripPrefix=1

app:
  observability:
    prometheus-public: ${PROMETHEUS_PUBLIC:false}
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE:gateway-sample-api}
      secret: ${JWT_SECRET}
      ttl: ${JWT_TTL:1h}
    demo-user:
      enabled: false
      username: ${DEMO_USERNAME:}
      password: ${DEMO_PASSWORD:}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      max-age: ${CORS_MAX_AGE:1h}

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: ${HTTP_HISTOGRAM_ENABLED:true}
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 5s
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENVIRONMENT:unknown}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: W3C
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${APP_ENVIRONMENT:unknown}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: ${spring.application.name}
    environment: ${APP_ENVIRONMENT:unknown}
    deployment-platform: ${DEPLOYMENT_PLATFORM:unknown}

logging:
  level:
    org.springframework.cloud.gateway: INFO
