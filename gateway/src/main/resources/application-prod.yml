# 6단계: prod profile에서 공통 application.yml에 덮어쓰는 설정.
# 운영용 INFO/ECS 구조화 로그. 비밀값은 외부에서 주입한다.
# CORS Origin은 외부에서 명시하며 데모 토큰 발급은 공통값 false를 유지한다.
app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.example.gateway: INFO
    org.springframework.cloud.gateway: WARN
  structured:
    format:
      console: ecs
