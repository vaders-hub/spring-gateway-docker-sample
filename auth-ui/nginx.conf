server {
    listen 8080;
    root /usr/share/nginx/html;
    # 인증 callback에는 code/state가 포함되므로 URL을 access log에 남기지 않는다.
    access_log off;
    add_header Cache-Control "no-store" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' http://localhost:8180 http://localhost:8080; frame-src http://localhost:8180; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location / { try_files $uri $uri/ =404; }
}
