# 2단계: 기본 Compose에 함께 지정하는 관측 overlay.
# local 앱의 scrape를 공개하고 observability profile로 Prometheus/Grafana를 추가한다.
services:
  gateway:
    environment:
      # 기본 local profile에서만 익명 scrape를 허용한다. 운영 환경에는 복사하지 않는다.
      PROMETHEUS_PUBLIC: "true"

  backend:
    environment:
      PROMETHEUS_PUBLIC: "true"

  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - gateway
      - backend
    networks:
      - app-net

  grafana:
    image: grafana/grafana:13.2.2
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run bash scripts/ensure-observability-env.sh first}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 이미지에 포함된 플러그인을 사용한다. 시작 시 자동 업데이트는 read_only 파일시스템과 충돌한다.
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      - prometheus
    networks:
      - app-net

# down은 named volume을 보존한다. down -v는 수집 데이터와 Grafana 저장 내용을 삭제한다.
volumes:
  prometheus-data:
  grafana-data:
