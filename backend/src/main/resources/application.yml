# 1·2·6단계: 모든 profile의 공통 설정. 환경변수와 application-{profile}.yml이 값을 보완한다.
# Servlet/Tomcat 기반 Backend: JWT를 재검증하고 Controller/Service로 요청을 처리한다.
server:
  port: 8081
  # SIGTERM 후 처리 중 요청을 마무리한다. 컨테이너 종료 유예시간과 함께 읽는다.
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: ${SERVER_TOMCAT_CONNECTION_TIMEOUT:5s}
    keep-alive-timeout: ${SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT:30s}
    max-connections: ${SERVER_TOMCAT_MAX_CONNECTIONS:500}
    accept-count: ${SERVER_TOMCAT_ACCEPT_COUNT:100}
    threads:
      max: ${SERVER_TOMCAT_THREADS_MAX:50}
      min-spare: ${SERVER_TOMCAT_THREADS_MIN_SPARE:5}

spring:
  application:
    name: backend
  # Gateway와 동일한 활성 토큰 목록을 조회한다. 저장소 장애 시 인증을 허용하지 않는다.
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_COMMAND_TIMEOUT:1s}
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  learning:
    docs-enabled: false
  observability:
    prometheus-public: ${PROMETHEUS_PUBLIC:false}
  # 필수 비밀값은 환경변수로 받는다. common/config/properties에서 시작 시 타입·필수값을 검증한다.
  security:
    jwt:
      issuer: ${JWT_ISSUER}
      audience: ${JWT_AUDIENCE:gateway-sample-api}
      secret: ${JWT_SECRET:}

management:
  info:
    env:
      enabled: true
  # 노출 대상과 인증 허용은 별개이다. common/config/SecurityConfig가 접근을 결정한다.
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        # 프로세스 생존과 트래픽 수신 가능 여부를 분리해 외부 의존성 장애의 재시작 전파를 피한다.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis
  # HTTP 서버 histogram/SLO로 지연 분포를 수집한다. 건강 검사도 지표에 포함될 수 있다.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: ${HTTP_HISTOGRAM_ENABLED:true}
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 5s
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENVIRONMENT:unknown}
  # sampling과 export는 별개이다. Collector/저장소가 없으므로 OTLP export는 기본 off이다.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.1}
    propagation:
      type: W3C
    export:
      otlp:
        enabled: ${OTEL_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      deployment.environment: ${APP_ENVIRONMENT:unknown}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

info:
  app:
    name: ${spring.application.name}
    environment: ${APP_ENVIRONMENT:unknown}
    # 실행 위치(docker-compose/kubernetes)이며 Spring lifecycle profile(local 등)과 구분한다.
    deployment-platform: ${DEPLOYMENT_PLATFORM:unknown}

logging:
  pattern:
    # SLF4J addKeyValue 필드를 local/dev 콘솔에서도 표시한다. ECS 출력은 자체 encoder를 사용한다.
    level: "%5p %kvp"

# 명세/UI는 local/test 학습용으로 명시적으로 켠다. Gateway 집계 문서는 별도다.
springdoc:
  api-docs:
    enabled: ${app.learning.docs-enabled}
  swagger-ui:
    enabled: ${app.learning.docs-enabled}
  paths-to-match: /hello,/echo,/members/**,/products/**,/orders/**


---
# local/test 메모리 저장소 모드만 DB 구성을 제외한다. dev/staging/prod는 기본 JPA이다.
spring:
  config:
    activate:
      on-profile: "(local | test) & !persistence"
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration

---
# JPA는 운영 기본값이다. local/test는 persistence를 추가해 같은 adapter를 학습한다.
spring:
  config:
    activate:
      on-profile: "(!local & !test) | persistence"
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
  jpa:
    # HTTP 응답 매핑 단계에서 SQL이 뒤늦게 발생하지 않도록 영속성 컨텍스트를 서비스 트랜잭션에 한정한다.
    open-in-view: false
    hibernate:
      # DDL 변경은 Flyway만 담당한다. Hibernate는 Entity와 실제 스키마의 일치 여부를 검사한다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    # 기존 스키마를 임의로 baseline 처리하지 않고 migration 이력의 부재를 오류로 확인한다.
    baseline-on-migrate: false
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis
# liveness에는 DB를 넣지 않는다. DB 장애로 앱 재시작이 반복되는 것을 방지한다.
