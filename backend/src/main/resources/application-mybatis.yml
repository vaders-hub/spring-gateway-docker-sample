# lifecycle(local/test/dev/staging/prod)과 함께 사용한다. persistence와 동시에 선택하지 않는다.
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration
      - org.springframework.boot.data.jpa.autoconfigure.DataJpaRepositoriesAutoConfiguration
mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: com.example.backend.common.persistence.mybatis
  configuration:
    default-statement-timeout: 3
    local-cache-scope: STATEMENT
    arg-name-based-constructor-auto-mapping: true
