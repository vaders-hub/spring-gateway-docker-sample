plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:4.0.8'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

springBoot {
    buildInfo {
        excludes = ['time']
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// Stable artifact name for independent Docker builds; version remains in build info.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}
