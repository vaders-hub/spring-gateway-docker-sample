plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.8'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.0.8')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Boot BOM이 Hibernate/Flyway/JDBC/Testcontainers의 호환 버전을 함께 관리한다.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    implementation 'org.mapstruct:mapstruct:1.6.3'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor:4.0.8'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'com.tngtech.archunit:archunit:1.5.1'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
}

springBoot {
    buildInfo {
        excludes = ['time']
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'database'
    }
}

// Stable artifact name for independent Docker builds; version remains in build info.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}


// 기본 test는 Docker 없이 실행된다. 실제 PostgreSQL 검증은 명시적으로 실행하며 Docker 부재를 skip하지 않는다.
tasks.register('databaseTest', Test) {
    description = 'Runs PostgreSQL integration tests using disposable Testcontainers.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'database' }
    shouldRunAfter tasks.named('test')
}

// Java 25에서 Mockito의 동적 self-attach에 의존하지 않는다. 테스트 JVM 시작 시 agent를 명시한다.
tasks.withType(Test).configureEach {
    doFirst {
        jvmArgs "-javaagent:${classpath.find { it.name.startsWith('mockito-core-') }}"
    }
}
