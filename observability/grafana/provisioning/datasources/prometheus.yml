# 2단계: Grafana가 시작할 때 Prometheus datasource를 등록한다.
# 지표 조회 연결만 설정하며 dashboard/panel은 학습자가 별도로 만든다.
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # 브라우저가 아니라 Grafana 서버 컨테이너가 Compose DNS로 Prometheus에 접속한다.
    url: http://prometheus:9090
    isDefault: true
    editable: false
