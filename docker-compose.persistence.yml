# 12단계 선택 overlay: 기본 Compose + 이 파일. 기존 01~11단계에는 DB가 필요하지 않다.
services:
  backend:
    environment:
      SPRING_PROFILES_ACTIVE: local,persistence
      DB_URL: jdbc:postgresql://postgres:5432/feature_lab
      DB_USERNAME: feature_lab
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/ensure-persistence-env.sh first}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17.11-alpine
    # 호스트에 포트를 공개하지 않는다. 프로젝트 app-net의 Backend/exec에서만 접근한다.
    environment:
      POSTGRES_DB: feature_lab
      POSTGRES_USER: feature_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bash scripts/ensure-persistence-env.sh first}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feature_lab -d feature_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-net
    stop_grace_period: 30s

volumes:
  # 컨테이너 재생성과 별개로 데이터가 유지된다. down -v는 학습 데이터를 삭제하므로 사용하지 않는다.
  postgres-data:
