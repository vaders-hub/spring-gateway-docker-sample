apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spring-gateway
  namespace: gateway-lab
spec:
  parentRefs:
    - name: edge-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: Exact
            value: /auth/token
      # Keep Authorization and paths unchanged. Spring owns JWT, CORS,
      # Redis rate limiting and StripPrefix=1. No /actuator route at the edge.
      backendRefs:
        - name: gateway
          port: 8080
