# 4·6단계: 동일 이미지에 namespace/복제본/설정 차이를 합치는 렌더링 실습.
# 별도 인증 Secret/신뢰 구성과 PostgreSQL/DB Secret이 필요하다. README.md의 준비 항목을 확인한다.
# Render-only learning example: supply authentication, PostgreSQL and database credentials before deployment.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: gateway-lab-staging
resources:
  - ../../base
replicas:
  - name: backend
    count: 2
patches:
  - path: config-patch.yaml
  - path: gateway-patch.yaml
  - path: backend-patch.yaml
