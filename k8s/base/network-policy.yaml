# Backend는 Gateway에서, Redis는 Gateway/Backend에서 접근한다(활성 토큰 확인).
# 집행에는 지원 CNI가 필요하고 여러 정책의 허용 규칙은 가산적이다.
# egress·TLS·JWT 인증을 대신하지 않으며 허용/차단 경로를 대조해 실제 동작을 검증한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-gateway-only
spec:
  # 보호 대상 Pod: backend label. 아래 from은 이 대상에 접근할 출발 Pod를 고른다.
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
      # namespaceSelector가 없으므로 같은 namespace의 Gateway만 선택한다.
      ports:
        - protocol: TCP
          port: 8081
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-from-gateway-only
spec:
  # 보호 대상 Pod: redis label. Gateway ingress 자체는 이 정책의 대상이 아니다.
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: gateway
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 6379
