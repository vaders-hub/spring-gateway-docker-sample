# 3~4단계: 비밀이 아닌 공통 환경변수. JWT_SECRET/데모 자격증명은 별도 Secret으로 주입한다.
# 환경변수로 받은 값은 ConfigMap을 수정해도 기존 프로세스에 자동 반영되지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # lifecycle profile은 정확히 하나 선택한다. 플랫폼 이름을 추가 profile로 붙이지 않는다.
  SPRING_PROFILES_ACTIVE: local
  APP_ENVIRONMENT: local
  DEPLOYMENT_PLATFORM: kubernetes
  JAVA_TOOL_OPTIONS: >-
    -XX:InitialRAMPercentage=25.0
    -XX:MaxRAMPercentage=75.0
    -Duser.timezone=UTC
  # 같은 namespace의 Service DNS. Pod 내부 localhost로 다른 Pod에 접근할 수 없다.
  BACKEND_URL: http://backend:8081
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_ISSUER: local-gateway
  JWT_AUDIENCE: gateway-sample-api
  JWT_TTL: 1h
  RATE_LIMIT_REPLENISH_RATE: "2"
  RATE_LIMIT_BURST_CAPACITY: "5"
  CORS_ALLOWED_ORIGINS: http://localhost:3000
  BACKEND_CONNECT_TIMEOUT_MS: "2000"
  BACKEND_RESPONSE_TIMEOUT: 5s
  BACKEND_MAX_CONNECTIONS: "50"
  SERVER_NETTY_CONNECTION_TIMEOUT: 2s
  SERVER_NETTY_IDLE_TIMEOUT: 30s
  SERVER_NETTY_MAX_KEEP_ALIVE_REQUESTS: "1000"
  SERVER_TOMCAT_CONNECTION_TIMEOUT: 5s
  SERVER_TOMCAT_KEEP_ALIVE_TIMEOUT: 30s
  SERVER_TOMCAT_MAX_CONNECTIONS: "500"
  SERVER_TOMCAT_ACCEPT_COUNT: "100"
  SERVER_TOMCAT_THREADS_MAX: "50"
  SERVER_TOMCAT_THREADS_MIN_SPARE: "5"
  TRACING_SAMPLING_PROBABILITY: "1.0"
  OTEL_EXPORT_ENABLED: "false"
  # Compose 관측 overlay와 달리 kind 기본 구성은 scrape에도 인증을 요구한다.
  PROMETHEUS_PUBLIC: "false"
