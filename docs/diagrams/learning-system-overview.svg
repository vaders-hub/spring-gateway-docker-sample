<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540" role="img" aria-labelledby="title desc">
<title id="title">Spring Gateway Lab — 현재 Compose 구성과 후속 Kubernetes 학습 구성</title>
<desc id="desc">클라이언트에서 Spring Cloud Gateway를 거쳐 Backend로 전달되는 API, Redis 요청 제한, Prometheus의 Actuator 지표 수집, Grafana 조회와 영속 볼륨을 나타낸다. 하단은 현재 실행하지 않는 kind, Envoy Gateway API, PVC 학습 확장이다.</desc>
